name: Check Firebase connection (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'hogeterp/Wildenhorst' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud without a key
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: wildenhorst-94729
          workload_identity_provider: projects/1062749373950/locations/global/workloadIdentityPools/github-wildenhorst/providers/github-actions
          service_account: github-firebase-rules@wildenhorst-94729.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          access_token_lifetime: 300s

      - name: Check read access to Firebase Rules
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --output /dev/null \
            'https://firebaserules.googleapis.com/v1/projects/wildenhorst-94729/releases?pageSize=1'
          echo 'Firebase authentication and read access succeeded.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No rules or database records were changed.' >> "$GITHUB_STEP_SUMMARY"
